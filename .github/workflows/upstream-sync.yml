name: Sync Upstream Safely

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: upstream-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.detect.outputs.updated }}
      mergeable: ${{ steps.mergeability.outputs.mergeable }}
      blocked: ${{ steps.sync_gate.outputs.blocked }}

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream main
        run: |
          git remote add upstream https://github.com/ZeroPointSix/outlookEmailPlus.git
          git fetch --no-tags upstream main

      - name: Detect upstream changes
        id: detect
        shell: bash
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "Fork already contains upstream/main" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "Upstream changes detected: $(git rev-parse --short upstream/main)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check upstream mergeability
        id: mergeability
        if: steps.detect.outputs.updated == 'true'
        shell: bash
        run: |
          set +e
          merge_output="$(git merge-tree --write-tree HEAD upstream/main 2>&1)"
          merge_status=$?
          if [ "$merge_status" -ne 0 ]; then
            echo "mergeable=false" >> "$GITHUB_OUTPUT"
            echo "上游包含与 fork 本地功能冲突的文件，本次自动同步跳过；不会修改 main 或生产镜像。" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$merge_output" | grep '^CONFLICT' | head -20 >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "mergeable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify sync push token
        id: sync_gate
        if: steps.detect.outputs.updated == 'true' && steps.mergeability.outputs.mergeable == 'true'
        shell: bash
        env:
          UPSTREAM_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [ -z "${UPSTREAM_SYNC_TOKEN:-}" ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "::warning::UPSTREAM_SYNC_TOKEN is not configured; upstream sync is blocked without failing the workflow"
            echo "上游同步已暂停：缺少 UPSTREAM_SYNC_TOKEN。配置后将恢复包含 workflow 文件的自动同步。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "blocked=false" >> "$GITHUB_OUTPUT"

      - name: Merge upstream into fork
        if: steps.detect.outputs.updated == 'true' && steps.mergeability.outputs.mergeable == 'true' && steps.sync_gate.outputs.blocked != 'true'
        run: git merge --no-ff --no-edit upstream/main

      - name: Set up Python
        if: steps.detect.outputs.updated == 'true' && steps.mergeability.outputs.mergeable == 'true' && steps.sync_gate.outputs.blocked != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install quality dependencies
        if: steps.detect.outputs.updated == 'true' && steps.mergeability.outputs.mergeable == 'true' && steps.sync_gate.outputs.blocked != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install coverage flake8 black isort mypy bandit[toml]

      - name: Run quality gate
        if: steps.detect.outputs.updated == 'true' && steps.mergeability.outputs.mergeable == 'true' && steps.sync_gate.outputs.blocked != 'true'
        run: |
          python -m compileall -q outlook_web web_outlook_app.py outlook_mail_reader.py start.py tests
          FORMAT_BASE_SHA=HEAD^1 bash scripts/check-changed-python-format.sh
          flake8 outlook_web tests web_outlook_app.py outlook_mail_reader.py start.py --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 outlook_web/repositories/settings.py outlook_web/services/external_api.py outlook_web/controllers/system.py web_outlook_app.py --count --max-complexity=10 --max-line-length=127 --statistics
          mypy --config-file pyproject.toml outlook_web/repositories/settings.py outlook_web/services/external_api.py outlook_web/controllers/system.py web_outlook_app.py
          bandit -r outlook_web web_outlook_app.py outlook_mail_reader.py start.py -lll
          coverage run -m unittest discover -s tests -v
          coverage report

      - name: Build and verify candidate image
        if: steps.detect.outputs.updated == 'true' && steps.mergeability.outputs.mergeable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull -t outlook-email-plus:upstream-sync .
          docker run -d --name outlook-email-plus-upstream-sync \
            -e SECRET_KEY=smoke-test-secret-key-00000000000000000000000000000000 \
            -p 127.0.0.1:5000:5000 \
            outlook-email-plus:upstream-sync
          for _ in $(seq 1 40); do
            status="$(docker inspect --format '{{.State.Health.Status}}' outlook-email-plus-upstream-sync 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              curl --fail --silent --show-error http://127.0.0.1:5000/healthz
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs outlook-email-plus-upstream-sync
              exit 1
            fi
            sleep 3
          done
          docker logs outlook-email-plus-upstream-sync
          echo "candidate container did not become healthy in time" >&2
          exit 1

      - name: Clean candidate resources
        if: always() && steps.detect.outputs.updated == 'true' && steps.mergeability.outputs.mergeable == 'true' && steps.sync_gate.outputs.blocked != 'true'
        run: |
          docker rm -f outlook-email-plus-upstream-sync 2>/dev/null || true
          docker image rm outlook-email-plus:upstream-sync 2>/dev/null || true

      - name: Push verified merge
        if: steps.detect.outputs.updated == 'true' && steps.mergeability.outputs.mergeable == 'true' && steps.sync_gate.outputs.blocked != 'true'
        shell: bash
        env:
          UPSTREAM_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "$UPSTREAM_SYNC_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git push origin HEAD:main

      - name: Dispatch verified image release
        if: steps.detect.outputs.updated == 'true' && steps.mergeability.outputs.mergeable == 'true' && steps.sync_gate.outputs.blocked != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'docker-build-push.yml',
              ref: 'main',
            });

  report-sync-status:
    if: always()
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Create, update, or close the sync failure issue
        uses: actions/github-script@v7
        env:
          SYNC_RESULT: ${{ needs.sync.result }}
          SYNC_MERGEABLE: ${{ needs.sync.outputs.mergeable }}
          SYNC_BLOCKED: ${{ needs.sync.outputs.blocked }}
        with:
          script: |
            const title = '[上游同步失败] 需要人工处理';
            const failed = process.env.SYNC_RESULT !== 'success';
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            const mergeable = process.env.SYNC_MERGEABLE || 'n/a';
            const blockedByConfig = process.env.SYNC_BLOCKED === 'true';
            const blockedByConflict = !failed && mergeable === 'false';
            const blocked = blockedByConfig || blockedByConflict;
            const details = `Workflow: ${context.workflow}\nRun: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}\nFork commit: ${context.sha}\nMergeable: ${mergeable}\nBlocked: ${blockedByConfig ? 'missing UPSTREAM_SYNC_TOKEN' : 'no'}`;

            if (failed || blocked) {
              const message = blockedByConfig
                ? '上游同步因缺少 UPSTREAM_SYNC_TOKEN 暂停；本次未修改 main 或生产镜像。配置该 Secret 后将恢复同步。'
                : blockedByConflict
                  ? '上游变更与 fork 的本地功能发生冲突，本次已跳过自动合并；main 与生产镜像保持不变，需要人工拆分处理。'
                : '自动合并、测试、镜像健康检查或推送失败。main 与生产镜像均不会被本次失败流程替换。';
              if (existing) {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: `${message}\n\n${details}` });
              } else {
                await github.rest.issues.create({
                  owner,
                  repo,
                  title,
                  body: `${message}\n\n${details}`,
                });
              }
              return;
            }

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `后续上游同步已恢复。\n\n${details}`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
            }
